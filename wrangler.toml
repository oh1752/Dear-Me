# Cloudflare Wrangler Configuration
name = "dear-me"
compatibility_date = "2024-05-03"

[assets]
directory = "./"
exclude = [".git", ".idx", ".vscode", "blueprint.md", "GEMINI.md"]

[triggers]
crons = ["0 0 * * *"]

[vars]
FIREBASE_PROJECT_ID = "YOUR_PROJECT_ID"
APP_URL = "https://dear-me.pages.dev"
# RESEND_API_KEY should be added as a Secret via: wrangler secret put RESEND_API_KEY
